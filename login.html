<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gastos Familiares</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fdf2f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #db2777;
            text-align: center;
            font-size: 1.8rem;
        }
        p.sub {
            text-align: center;
            color: #666;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: #555;
            margin-bottom: 0.3rem;
        }
        input {
            width: 100%;
            padding: 0.7rem;
            border: 2px solid #fce4ec;
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #ec4899;
        }
        .btn {
            width: 100%;
            padding: 0.8rem;
            background: #ec4899;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .btn:hover {
            background: #db2777;
        }
        .switch {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
        .switch a {
            color: #ec4899;
            cursor: pointer;
            font-weight: 600;
        }
        .error {
            color: #f43f5e;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 0.8rem 1.5rem;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            z-index: 999;
            animation: subir 0.3s ease;
        }
        .toast--exito { background: #10b981; }
        .toast--error { background: #ef4444; }
        @keyframes subir {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>💰 Gastos Familiares</h1>
    <p class="sub">Administra los gastos de tu familia</p>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="error" id="errorMsg"></div>
        <button type="submit" class="btn" id="btnSubmit">Entrar</button>
    </form>

    <div class="switch">
        <span id="switchText">¿No tienes cuenta? <a id="switchLink">Regístrate aquí</a></span>
    </div>
</div>

<script>
    // =========================================================
    // ESPERAR A QUE SUPABASE ESTÉ LISTO
    // =========================================================
    document.addEventListener('DOMContentLoaded', function() {

        // Verificar que supabase existe
        if (typeof supabase === 'undefined') {
            document.getElementById('errorMsg').textContent = 'Error: Supabase no está configurado. Revisa supabaseClient.js';
            return;
        }

        // Elementos
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const btnSubmit = document.getElementById('btnSubmit');
        const switchLink = document.getElementById('switchLink');
        const switchText = document.getElementById('switchText');

        let modo = 'login';

        // Función para cambiar entre login y registro
        function toggleModo() {
            if (modo === 'login') {
                modo = 'registro';
                btnSubmit.textContent = 'Crear cuenta';
                switchText.innerHTML = '¿Ya tienes cuenta? <a id="switchLink">Inicia sesión</a>';
                document.getElementById('switchLink').addEventListener('click', toggleModo);
            } else {
                modo = 'login';
                btnSubmit.textContent = 'Entrar';
                switchText.innerHTML = '¿No tienes cuenta? <a id="switchLink">Regístrate aquí</a>';
                document.getElementById('switchLink').addEventListener('click', toggleModo);
            }
            errorMsg.textContent = '';
        }

        // Evento del enlace para cambiar modo
        switchLink.addEventListener('click', toggleModo);

        // Toast (notificación)
        function mostrarToast(mensaje, tipo = 'exito') {
            const toast = document.createElement('div');
            toast.className = 'toast toast--' + tipo;
            toast.textContent = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Enviar formulario
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorMsg.textContent = '';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorMsg.textContent = 'Completa todos los campos';
                return;
            }

            try {
                if (modo === 'login') {
                    // INICIAR SESIÓN
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        errorMsg.textContent = 'Error: ' + error.message;
                        return;
                    }

                    mostrarToast('¡Bienvenido!', 'exito');
                    window.location.href = 'index.html';

                } else {
                    // REGISTRARSE
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password
                    });

                    if (error) {
                        errorMsg.textContent = 'Error: ' + error.message;
                        return;
                    }

                    mostrarToast('Cuenta creada. Inicia sesión.', 'exito');
                    // Cambiar a modo login automáticamente
                    modo = 'login';
                    btnSubmit.textContent = 'Entrar';
                    switchText.innerHTML = '¿No tienes cuenta? <a id="switchLink">Regístrate aquí</a>';
                    document.getElementById('switchLink').addEventListener('click', toggleModo);
                    emailInput.value = email;
                    passwordInput.value = '';
                    errorMsg.textContent = 'Cuenta creada. Ahora inicia sesión.';
                }

            } catch (err) {
                errorMsg.textContent = 'Error inesperado: ' + err.message;
                console.error(err);
            }
        });

        // Si ya hay sesión, redirigir
        (async function checkSession() {
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                window.location.href = 'index.html';
            }
        })();

    });
</script>

</body>
</html>
