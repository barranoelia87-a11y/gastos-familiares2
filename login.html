<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Gastos Familiares</title>
    
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- ✅ ESTO ES LO QUE FALTABA: enlazar a style.css -->
    <link rel="stylesheet" href="css/style.css" />
    
    <style>
        /* Estilos específicos para el login */
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg, #fdf2f8);
            padding: 1rem;
        }
        .login-card {
            background: var(--color-surface, #ffffff);
            border-radius: var(--radius, 24px);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow, 0 8px 32px rgba(236, 72, 153, 0.15));
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--color-primary-dark, #db2777);
            margin-bottom: 0.3rem;
        }
        .login-card .subtitle {
            color: var(--color-text-light, #9ca3af);
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
        }
        .login-card .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }
        .login-card .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-light, #9ca3af);
            margin-bottom: 0.3rem;
        }
        .login-card .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--color-border, #fce4ec);
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--color-bg, #fdf2f8);
            transition: border 0.25s, box-shadow 0.25s;
        }
        .login-card .form-group input:focus {
            outline: none;
            border-color: var(--color-primary, #ec4899);
            box-shadow: 0 0 0 4px rgba(236, 72, 153, 0.12);
        }
        .login-card .btn-login {
            width: 100%;
            padding: 0.8rem;
            background: var(--color-primary, #ec4899);
            color: #fff;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 0.5rem;
        }
        .login-card .btn-login:hover {
            background: var(--color-primary-dark, #db2777);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(236, 72, 153, 0.35);
        }
        .login-card .btn-login:active {
            transform: translateY(0);
        }
        .login-card .login-footer {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: var(--color-text-light, #9ca3af);
        }
        .login-card .login-footer a {
            color: var(--color-primary, #ec4899);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .login-card .login-footer a:hover {
            text-decoration: underline;
        }
        .login-card .error-msg {
            color: var(--color-danger, #f43f5e);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }
        /* Toggle entre login y registro */
        .toggle-form {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .toggle-form button {
            background: none;
            border: none;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-text-light, #9ca3af);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.25s;
            font-family: inherit;
        }
        .toggle-form button.active {
            color: var(--color-primary, #ec4899);
            border-bottom-color: var(--color-primary, #ec4899);
        }
        .toggle-form button:hover {
            color: var(--color-primary, #ec4899);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>💰 Gastos Familiares</h1>
            <p class="subtitle">Administra los gastos de tu familia</p>

            <!-- Toggle: Login / Registro -->
            <div class="toggle-form">
                <button id="btnLoginTab" class="active">Iniciar sesión</button>
                <button id="btnRegistroTab">Crear cuenta</button>
            </div>

            <!-- Formulario de Login -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required />
                </div>
                <div class="error-msg" id="errorMsg"></div>
                <button type="submit" class="btn-login" id="btnSubmit">Entrar</button>
            </form>

            <div class="login-footer">
                <span id="footerText">¿No tienes cuenta? <a id="toggleLink">Regístrate aquí</a></span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // =========================================================
        // LOGICA DE LOGIN / REGISTRO
        // =========================================================
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const btnSubmit = document.getElementById('btnSubmit');
        const toggleLink = document.getElementById('toggleLink');
        const footerText = document.getElementById('footerText');
        const btnLoginTab = document.getElementById('btnLoginTab');
        const btnRegistroTab = document.getElementById('btnRegistroTab');

        let modo = 'login'; // 'login' o 'registro'

        function setModo(nuevoModo) {
            modo = nuevoModo;
            if (modo === 'login') {
                btnSubmit.textContent = 'Entrar';
                footerText.innerHTML = '¿No tienes cuenta? <a id="toggleLink">Regístrate aquí</a>';
                btnLoginTab.classList.add('active');
                btnRegistroTab.classList.remove('active');
                document.getElementById('toggleLink').addEventListener('click', () => setModo('registro'));
            } else {
                btnSubmit.textContent = 'Crear cuenta';
                footerText.innerHTML = '¿Ya tienes cuenta? <a id="toggleLink">Inicia sesión</a>';
                btnRegistroTab.classList.add('active');
                btnLoginTab.classList.remove('active');
                document.getElementById('toggleLink').addEventListener('click', () => setModo('login'));
            }
            errorMsg.textContent = '';
        }

        // Eventos de los tabs
        btnLoginTab.addEventListener('click', () => setModo('login'));
        btnRegistroTab.addEventListener('click', () => setModo('registro'));

        // Toggle inicial
        document.addEventListener('DOMContentLoaded', () => {
            setModo('login');
        });

        // Submit del formulario
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                errorMsg.textContent = 'Completa todos los campos';
                return;
            }

            try {
                if (modo === 'login') {
                    // INICIAR SESIÓN
                    const { data, error } = await iniciarSession(email, password);
                    if (error) {
                        errorMsg.textContent = 'Error: ' + error.message;
                        return;
                    }
                    mostrarToast('¡Bienvenido!', 'exito');
                    window.location.href = 'index.html';
                } else {
                    // REGISTRARSE
                    const { data, error } = await registrar(email, password);
                    if (error) {
                        errorMsg.textContent = 'Error: ' + error.message;
                        return;
                    }
                    mostrarToast('Cuenta creada. Inicia sesión.', 'exito');
                    setModo('login');
                    emailInput.value = email;
                    passwordInput.value = '';
                }
            } catch (err) {
                errorMsg.textContent = 'Error inesperado: ' + err.message;
            }
        });
    </script>
</body>
</html>
